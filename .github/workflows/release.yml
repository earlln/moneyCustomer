name: Release

# Windows 용 exe 를 빌드하고 GitHub Release 를 생성한다.
# PyInstaller 는 크로스 컴파일을 지원하지 않으므로 exe 빌드는 반드시
# windows-latest 러너에서 수행해야 한다.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '수행할 작업'
        required: true
        type: choice
        options:
          - release
          - delete
        default: release
      tag:
        description: '릴리스 태그 (예: v2.1.0)'
        required: true
        type: string
      ref:
        description: '릴리스 대상 커밋 SHA 또는 브랜치 (delete 시에는 무시됨)'
        required: false
        default: ''
        type: string
      build_windows_exe:
        description: 'Windows exe 를 빌드해 릴리스에 첨부'
        required: true
        type: boolean
        default: true
      prerelease:
        description: '프리릴리스로 표시'
        required: false
        type: boolean
        default: false
      recreate:
        description: '같은 태그의 기존 릴리스·태그를 지우고 다시 만들기'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PACKAGE_NAME: MoneyCustomer_${{ inputs.tag }}_win64
# PYTHONIOENCODING 은 일부러 설정하지 않는다. 이 변수를 켜 두면 출력 인코딩
# 문제가 가려져, 배포 대상 PC 에서만 UnicodeEncodeError 가 터지는 상황을
# 빌드 단계에서 잡을 수 없다. exe 자체가 UTF-8 출력을 보장해야 한다.

jobs:
  build-windows-exe:
    if: ${{ inputs.action == 'release' && inputs.build_windows_exe }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Java 미설치 상태 확인
        shell: bash
        # v2.0.0 의 핵심 요구사항: JVM 없이 동작해야 한다.
        # JAVA_HOME 을 지우고 빌드/테스트해 Java 의존성이 남아있지 않음을 보장한다.
        run: |
          echo "JAVA_HOME=" >> "$GITHUB_ENV"
          # 아래 python 은 러너의 빌드용 파이썬이다. exe 실행과 달리 여기서는
          # 출력 인코딩을 명시해 준다 (러너 콘솔이 cp1252 인 영문 Windows).
          PYTHONIOENCODING=utf-8 python -c "import importlib.util as u; assert u.find_spec('konlpy') is None, 'konlpy(Java 의존)가 설치되어 있습니다'; print('konlpy 미설치 확인')"

      - name: 로직 단위 테스트
        shell: bash
        # 모델·대용량 데이터 없이 판정 로직만 빠르게 확인한다.
        # exe 로 묶기 전에 돌려, 깨진 로직이 릴리스로 넘어가지 않도록 한다.
        run: PYTHONIOENCODING=utf-8 python tests/test_logic.py

      - name: exe 빌드 (PyInstaller)
        shell: bash
        run: pyinstaller --noconfirm --clean MoneyCustomer.spec

      - name: 배포 패키지 구성
        shell: bash
        run: |
          set -euo pipefail
          pkg="package/${PACKAGE_NAME}"
          mkdir -p "$pkg"
          cp -r dist/MoneyCustomer/. "$pkg/"
          cp features.json request_model.pkl request_vectorizer.pkl "$pkg/"
          cp model_meta.json "$pkg/" 2>/dev/null || echo "model_meta.json 없음 - 건너뜀"
          cp train_20260527.csv sample_input.csv "$pkg/"
          cp README.md 사용설명서.txt 자체점검.bat "$pkg/"
          ls -la "$pkg"

      - name: 스모크 테스트 (파이썬·Java 없는 stand-alone PC 시뮬레이션)
        shell: bash
        # 배포 대상은 파이썬도 Java 도 설치되지 않은 stand-alone PC 다.
        # 러너에는 빌드용 파이썬이 깔려 있으므로, 그대로 실행하면 시스템 파이썬에
        # 의존하는지 알 수 없다. 따라서
        #   1) PATH 에서 파이썬 경로를 모두 제거하고
        #   2) PYTHONHOME/PYTHONPATH/JAVA_HOME 등 관련 환경변수를 비우고
        #   3) 저장소 밖의 별도 폴더로 복사해
        # 실제 배포 환경과 동일한 조건에서 세 exe 를 모두 실행한다.
        run: |
          set -euo pipefail

          target="/c/mc_standalone/${PACKAGE_NAME}"
          mkdir -p "$(dirname "$target")"
          cp -r "package/${PACKAGE_NAME}" "$target"

          # PATH 에서 파이썬이 들어 있는 디렉터리를 전부 제거한다.
          clean_path=""
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if [ -e "$dir/python.exe" ] || [ -e "$dir/python3.exe" ] || [ -e "$dir/pythonw.exe" ]; then
              echo "PATH 에서 제거: $dir"
              continue
            fi
            case "$dir" in
              *[Pp]ython*|*[Pp]ip*|*hostedtoolcache*) echo "PATH 에서 제거: $dir"; continue ;;
            esac
            clean_path="${clean_path:+$clean_path:}$dir"
          done < <(echo "$PATH" | tr ':' '\n')

          run_standalone() {
            env -u PYTHONHOME -u PYTHONPATH -u PYTHONSTARTUP -u PYTHONEXECUTABLE \
                -u JAVA_HOME -u JRE_HOME -u CLASSPATH -u VIRTUAL_ENV -u CONDA_PREFIX \
                PATH="$clean_path" "$@"
          }

          echo "----- stand-alone 환경 확인 (python·java 가 없어야 정상) -----"
          # 하위 셸을 띄우지 않고 정리된 PATH 를 직접 훑어 확인한다.
          # (하위 셸 실행이 실패하면 "못 찾음" 과 구분되지 않기 때문)
          leaked=""
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            for exe in python.exe python3.exe pythonw.exe java.exe; do
              [ -e "$dir/$exe" ] && leaked="$leaked $dir/$exe"
            done
          done < <(echo "$clean_path" | tr ':' '\n')
          if [ -n "$leaked" ]; then
            echo "::error::정리된 PATH 에 인터프리터가 남아 있어 stand-alone 검증이 무의미합니다:$leaked"
            exit 1
          fi
          echo "파이썬·Java 없는 환경 확인 완료"

          # 작업 디렉터리를 exe 폴더 바깥에 두어, 설정·모델 파일을 exe 위치 기준으로
          # 찾는지(더블클릭·바로가기 실행 시나리오) 함께 검증한다.
          cd /c

          echo "----- batch_predict.exe -----"
          run_standalone "$target/batch_predict.exe" -i sample_input.csv -o smoke_output.csv --show --no-pause

          # 배치 스케줄러처럼 콘솔이 아닌 파일로 출력을 넘기는 경우도 확인한다.
          # 이때 파이썬은 콘솔 유니코드 API 대신 시스템 ANSI 코드페이지를 쓰므로,
          # exe 가 UTF-8 출력을 보장하지 않으면 한글에서 UnicodeEncodeError 가 난다.
          echo "----- batch_predict.exe (출력 리다이렉션) -----"
          run_standalone "$target/batch_predict.exe" -i sample_input.csv -o redirect_output.csv --no-pause > "$target/redirect_stdout.log" 2>&1
          tail -n 5 "$target/redirect_stdout.log"

          echo "----- evaluate_model.exe -----"
          run_standalone "$target/evaluate_model.exe" -d sample_input.csv --no-pause

          echo "----- train_model.exe (축소 데이터로 재학습) -----"
          PYTHONIOENCODING=utf-8 python - "$target" <<'PY'
          import csv, json, os, sys
          target = sys.argv[1]
          with open(os.path.join(target, 'train_20260527.csv'), encoding='cp949', newline='') as f:
              rows = list(csv.reader(f))
          with open(os.path.join(target, 'mini.csv'), 'w', encoding='utf-8-sig', newline='') as f:
              csv.writer(f).writerows(rows[:1201])
          cfg_path = os.path.join(target, 'features.json')
          cfg = json.load(open(cfg_path, encoding='utf-8'))
          cfg['files']['train_data'] = 'mini.csv'
          json.dump(cfg, open(cfg_path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          run_standalone "$target/train_model.exe" --no-pause

      - name: 스모크 테스트 결과 검증
        shell: bash
        run: |
          set -euo pipefail
          # 검증 스크립트도 러너 파이썬으로 돌므로 출력 인코딩을 명시한다.
          # exe 실행 자체는 위 스텝에서 이 변수 없이 검증했다.
          PYTHONIOENCODING=utf-8 python - "/c/mc_standalone/${PACKAGE_NAME}" <<'PY'
          import csv, json, os, sys

          target = sys.argv[1]
          p = lambda *a: os.path.join(target, *a)

          # 1) 추론 결과 컬럼 구성
          with open(p('smoke_output.csv'), encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          assert rows, '추론 결과가 비어 있습니다'
          for col in ('prediction', 'label', 'prob_0', 'prob_1', 'prob_2', 'prob_3',
                      'is_major', 'major_label'):
              assert col in rows[0], f'결과 컬럼 누락: {col}'

          # 2) 콘솔이 아닌 파일로 출력해도 한글이 깨지거나 죽지 않아야 한다
          log = open(p('redirect_stdout.log'), encoding='utf-8').read()
          assert 'UnicodeEncodeError' not in log, f'출력 리다이렉션 시 인코딩 오류:\n{log[-2000:]}'
          assert '결과 요약' in log, f'리다이렉션 로그에 한글이 정상 기록되지 않았습니다:\n{log[-2000:]}'
          assert os.path.exists(p('redirect_output.csv')), '리다이렉션 실행의 결과 CSV 가 없습니다'

          # 3) 평가·재학습 산출물
          assert os.path.exists(p('evaluation_report.txt')), '평가 리포트가 없습니다'
          assert os.path.exists(p('train_log.txt')), '학습 로그가 없습니다'
          meta = json.load(open(p('model_meta.json'), encoding='utf-8'))
          assert meta['tokenizer']['backend'] == 'kiwi', meta['tokenizer']
          assert meta['train_data'] == 'mini.csv', meta['train_data']

          # 4) 파이썬 없는 PC 를 위해 런타임이 번들에 들어있는지 확인
          internal = p('_internal')
          names = {n.lower() for n in os.listdir(internal)}
          assert any(n.startswith('python3') and n.endswith('.dll') for n in names), \
              f'파이썬 런타임 DLL 이 번들에 없습니다: {sorted(names)[:40]}'
          # Windows 에 기본 탑재되지 않을 수 있는 MSVC 런타임도 함께 배포되어야 한다.
          for dll in ('vcruntime140.dll', 'msvcp140.dll'):
              assert dll in names, f'{dll} 이 번들에 없습니다 (VC++ 재배포 패키지 의존 위험)'

          # 5) Java 흔적이 없어야 한다
          for root, _, files in os.walk(target):
              for f in files:
                  low = f.lower()
                  assert not low.endswith('.jar'), f'jar 파일 발견: {os.path.join(root, f)}'
                  assert 'jvm' not in low and 'jpype' not in low, \
                      f'Java 관련 파일 발견: {os.path.join(root, f)}'

          print(f'stand-alone 스모크 테스트 통과: {len(rows)}행 추론 / 평가 / 재학습 정상')
          PY
          rm -rf "/c/mc_standalone"

      - name: 압축
        shell: bash
        # 7z 은 windows 러너에 기본 설치되어 있고, -mcu=on 으로 한글 파일명을
        # UTF-8 로 저장해 압축 해제 시 이름이 깨지지 않는다.
        run: |
          set -euo pipefail
          7z a -tzip -mx=5 -mcu=on "${PACKAGE_NAME}.zip" "./package/${PACKAGE_NAME}"
          ls -la "${PACKAGE_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          retention-days: 30

  release:
    needs: [build-windows-exe]
    # exe 빌드를 건너뛴 경우(소스 전용 릴리스)에도 실행되어야 한다.
    if: ${{ always() && inputs.action == 'release' && (needs.build-windows-exe.result == 'success' || needs.build-windows-exe.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # 릴리스 노트는 항상 워크플로가 실행된 브랜치 최신 상태에서 읽는다.
      # 태그가 붙는 커밋(inputs.ref)에는 아직 노트 파일이 없을 수 있기 때문이다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 빌드 산출물 내려받기
        if: ${{ inputs.build_windows_exe }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: assets

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.ref }}
          PRERELEASE: ${{ inputs.prerelease }}
          RECREATE: ${{ inputs.recreate }}
        shell: bash
        run: |
          set -euo pipefail

          # ref 를 비워두고 실행한 경우 워크플로가 돌고 있는 커밋을 대상으로 삼는다.
          if [ -z "$TARGET" ]; then
            TARGET="$GITHUB_SHA"
            echo "ref 가 비어 있어 현재 커밋을 대상으로 사용합니다: $TARGET"
          fi

          # 태그가 가리키는 커밋을 옮겨야 할 때는 릴리스와 태그를 함께 지운다.
          # 태그는 그대로 둔 채 자산만 교체하면, 태그의 소스와 첨부된 exe 가
          # 서로 다른 커밋에서 나오는 상태가 되기 때문이다.
          if [ "$RECREATE" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리스와 태그를 삭제합니다: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          notes="docs/release-notes/${TAG}.md"
          args=(release create "$TAG" --target "$TARGET" --title "$TAG")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -d assets ] && [ -n "$(ls -A assets 2>/dev/null)" ]; then
            args+=(assets/*)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "릴리스 $TAG 가 이미 존재합니다. 자산만 갱신합니다."
            if [ -d assets ] && [ -n "$(ls -A assets 2>/dev/null)" ]; then
              gh release upload "$TAG" assets/* --clobber
            fi
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --notes-file "$notes"
            fi
          else
            gh "${args[@]}"
          fi

          gh release view "$TAG"

  delete-release:
    # 릴리스를 목록에서 내릴 때 사용한다. 태그도 함께 지워 릴리스 없는
    # 태그가 남지 않도록 한다. 릴리스 노트 문서는 저장소에 그대로 보존된다.
    if: ${{ inputs.action == 'delete' }}
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스 및 태그 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "릴리스 $TAG 가 존재하지 않습니다. 태그만 정리합니다."
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" 2>/dev/null \
              && echo "태그 $TAG 삭제됨" || echo "태그 $TAG 도 없습니다. 할 일이 없습니다."
            exit 0
          fi

          echo "삭제 전 상태:"
          gh release view "$TAG" --json tagName,publishedAt,assets \
            --jq '"  태그: \(.tagName)\n  게시: \(.publishedAt)\n  자산: \([.assets[] | "\(.name) (다운로드 \(.downloadCount)회)"] | join(", "))"'

          gh release delete "$TAG" --yes --cleanup-tag
          echo "릴리스와 태그 $TAG 를 삭제했습니다."

          echo ""
          echo "남은 릴리스:"
          gh release list --limit 20
